<html lang="en">
  <head>
    <title>Film View</title>
  </head>
  <body>
    <input id="search-input" type="text" placeholder="Search films..." />
    <div id="films-container"></div>
    <template id="film-card">
        <section>
            <h3>Film title</h3>
            <p data-director>Director</p>
            <time>Duration</time>
            <data data-certificate>Certificate</data>
        </section>
    </template>
    <script>
        const state = {
            films: [
                {
                title: "Killing of Flower Moon",
                director: "Martin Scorsese",
                times: ["15:35"],
                certificate: "15",
                duration: 112,
                },
                {
                title: "Typist Artist Pirate King",
                director: "Carol Morley",
                times: ["15:00", "20:00"],
                certificate: "12A",
                duration: 108,
                },
            ],
            searchTerm:"",
        };

      const template=document.getElementById("film-card");
      const filmsContainer=document.getElementById("films-container");
        const createFilmCard=(film)=>{
            const card=template.content.cloneNode(true);
            card.querySelector("h3").textContent=film.title;
            card.querySelector("[data-director]").textContent=`Director: ${film.director}`;
            card.querySelector("time").textContent=`${film.duration} minutes`;
            card.querySelector("[data-certificate]").textContent=`Certificate: ${film.certificate}`;
            return card;
        }

        function render(){
            filmsContainer.innerHTML="";
            const filteredFilms = state.films.filter((film) =>
                film.title.toLowerCase().includes(state.searchTerm.toLowerCase())
            );
            const filmCards=filteredFilms.map(createFilmCard);
            filmsContainer.append(...filmCards);
        }

        const searchBox=document.getElementById("search-input");
        searchBox.addEventListener("input",handleSearchInput);

        function handleSearchInput(event){
            state.searchTerm=event.target.value;
            render();
        }

        render()



    </script>
  </body>
</html>
